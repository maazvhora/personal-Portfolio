<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b15"/>
      <stop offset="100%" stop-color="#381932"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b2964"/>
      <stop offset="100%" stop-color="#fff3e6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#fff3e6" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#bgGrad)" stroke="url(#brandGrad)" stroke-width="3"/>

  <!-- Code Monogram <M/> -->
  <g filter="url(#glow)">
    <!-- Left Angle Bracket < -->
    <path d="M 28 40 L 19 50 L 28 60" fill="none" stroke="#fff3e6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Bold 'M' Center -->
    <path d="M 36 62 L 36 38 L 50 51 L 64 38 L 64 62" fill="none" stroke="#fff3e6" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Angle Bracket > -->
    <path d="M 72 40 L 81 50 L 72 60" fill="none" stroke="#b86299" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
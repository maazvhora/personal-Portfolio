<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g fill="#ff1e42" stroke="#ff1e42" filter="url(#shadow)">
    <!-- Pedipalps (Front feelers) -->
    <path d="M 47 21 Q 44 14 42 15" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <path d="M 53 21 Q 56 14 58 15" stroke-width="2.6" stroke-linecap="round" fill="none"/>

    <!-- Head -->
    <ellipse cx="50" cy="24" rx="6" ry="5" stroke-width="0"/>

    <!-- Cephalothorax (Middle Body) -->
    <ellipse cx="50" cy="37" rx="8.5" ry="8" stroke-width="0"/>

    <!-- Abdomen (Back Body) -->
    <ellipse cx="50" cy="59" rx="13" ry="16" stroke-width="0"/>

    <!-- 8 Jointed Legs -->
    <!-- Leg 1 (Front Left) -->
    <path d="M 44 32 L 28 14 L 20 6" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Leg 1 (Front Right) -->
    <path d="M 56 32 L 72 14 L 80 6" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Leg 2 (Front-Mid Left) -->
    <path d="M 43 35 L 18 24 L 8 32" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Leg 2 (Front-Mid Right) -->
    <path d="M 57 35 L 82 24 L 92 32" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Leg 3 (Rear-Mid Left) -->
    <path d="M 43 39 L 15 54 L 10 68" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Leg 3 (Rear-Mid Right) -->
    <path d="M 57 39 L 85 54 L 90 68" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Leg 4 (Rear Left) -->
    <path d="M 44 43 L 26 76 L 32 94" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Leg 4 (Rear Right) -->
    <path d="M 56 43 L 74 76 L 68 94" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>